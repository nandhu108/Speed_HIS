name: prixo-his

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prixo_his
      POSTGRES_USER: prixo
      POSTGRES_PASSWORD: ${DB_PASSWORD:-prixo_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prixo -d prixo_his"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../backend
      dockerfile: ../docker/api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=db;Port=5432;Database=prixo_his;Username=prixo;Password=${DB_PASSWORD:-prixo_dev_password}
      Cors__AllowedOrigins__0: http://localhost:3000
    ports:
      - "5000:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../frontend
      dockerfile: ../docker/web.Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@prixo.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-prixo_dev_password}
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata:
